<div class="row justify-content-center">
  <div class="col-12 col-md-10 col-lg-6">
    <div class="card tarjeta">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <img src="logo.svg" width="56" height="56" alt="Logo de ForoNova" class="mb-2" />
          <h1 class="h4 fw-bold mb-1">Crear cuenta</h1>
          <p class="text-muted mb-0">Únete a la comunidad de ForoNova</p>
        </div>

        <form [formGroup]="form" (ngSubmit)="registrar()" novalidate>
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label for="nombre" class="form-label">Nombre completo</label>
              <input id="nombre" type="text" class="form-control" formControlName="nombre" autocomplete="name"
                     [class.is-invalid]="form.controls.nombre.invalid && form.controls.nombre.touched" />
              <app-error-campo [control]="form.controls.nombre" [mensajes]="{
                required: 'El nombre es obligatorio',
                minlength: 'Debe tener al menos 3 caracteres',
                maxlength: 'No puede superar los 40 caracteres',
                pattern: 'Solo se permiten letras y espacios'
              }" />
            </div>

            <div class="col-12 col-md-6">
              <label for="correo" class="form-label">Correo electrónico</label>
              <input id="correo" type="email" class="form-control" formControlName="correo" autocomplete="email"
                     [class.is-invalid]="form.controls.correo.invalid && form.controls.correo.touched" />
              <app-error-campo [control]="form.controls.correo" [mensajes]="{
                required: 'El correo es obligatorio',
                email: 'Ingresa un correo válido',
                correoEnUso: 'Este correo ya está registrado'
              }" />
            </div>

            <div class="col-12 col-md-6">
              <label for="clave" class="form-label">Contraseña</label>
              <div class="input-group has-validation">
                <input id="clave" [type]="verClave() ? 'text' : 'password'" class="form-control" formControlName="clave"
                       autocomplete="new-password"
                       [class.is-invalid]="form.controls.clave.invalid && form.controls.clave.touched" />
                <button type="button" class="btn btn-outline-secondary" (click)="verClave.set(!verClave())"
                        [attr.aria-label]="verClave() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                  <i class="bi" [class.bi-eye]="!verClave()" [class.bi-eye-slash]="verClave()"></i>
                </button>
              </div>
              <app-error-campo [control]="form.controls.clave" [mensajes]="{ required: 'La contraseña es obligatoria' }" />
              <app-checklist-clave [valor]="form.controls.clave.value" />
            </div>

            <div class="col-12 col-md-6">
              <label for="confirmarClave" class="form-label">Confirmar contraseña</label>
              <input id="confirmarClave" [type]="verClave() ? 'text' : 'password'" class="form-control"
                     formControlName="confirmarClave" autocomplete="new-password"
                     [class.is-invalid]="form.controls.confirmarClave.touched && (form.controls.confirmarClave.invalid || form.hasError('noCoinciden'))" />
              <app-error-campo [control]="form.controls.confirmarClave" [mensajes]="{ required: 'Debes confirmar la contraseña' }" />
              @if (form.hasError('noCoinciden') && form.controls.confirmarClave.touched && form.controls.confirmarClave.value) {
                <div class="invalid-feedback d-block">Las contraseñas no coinciden</div>
              }
            </div>

            <div class="col-12">
              <div class="form-check">
                <input id="terminos" type="checkbox" class="form-check-input" formControlName="terminos"
                       [class.is-invalid]="form.controls.terminos.invalid && form.controls.terminos.touched" />
                <label for="terminos" class="form-check-label">
                  Acepto las normas del foro (respeto, sin spam y sin contenido ofensivo)
                </label>
                <app-error-campo [control]="form.controls.terminos" [mensajes]="{ required: 'Debes aceptar las normas para continuar' }" />
              </div>
            </div>

            <div class="col-12">
              <button type="submit" class="btn btn-primary w-100">Crear cuenta</button>
            </div>
          </div>
        </form>

        <p class="text-center mt-3 mb-0">
          ¿Ya tienes cuenta? <a routerLink="/login" class="fw-semibold">Inicia sesión</a>
        </p>
      </div>
    </div>
  </div>
</div>
