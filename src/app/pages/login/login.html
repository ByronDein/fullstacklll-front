<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-5">
    <div class="card tarjeta">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <img src="logo.svg" width="56" height="56" alt="Logo de ForoNova" class="mb-2" />
          <h1 class="h4 fw-bold mb-1">Iniciar sesión</h1>
          <p class="text-muted mb-0">Entra a ForoNova para conversar con la comunidad</p>
        </div>

        @if (error()) {
          <div class="alert alert-danger py-2" role="alert">
            <i class="bi bi-exclamation-triangle me-1"></i>{{ error() }}
          </div>
        }

        <form [formGroup]="form" (ngSubmit)="ingresar()" novalidate>
          <div class="mb-3">
            <label for="correo" class="form-label">Correo electrónico</label>
            <input id="correo" type="email" class="form-control" formControlName="correo"
                   autocomplete="email" placeholder="tucorreo@ejemplo.cl"
                   [class.is-invalid]="form.controls.correo.invalid && form.controls.correo.touched" />
            <app-error-campo [control]="form.controls.correo"
              [mensajes]="{ required: 'El correo es obligatorio', email: 'Ingresa un correo válido' }" />
          </div>

          <div class="mb-3">
            <label for="clave" class="form-label">Contraseña</label>
            <div class="input-group has-validation">
              <input id="clave" [type]="verClave() ? 'text' : 'password'" class="form-control" formControlName="clave"
                     autocomplete="current-password" placeholder="Tu contraseña"
                     [class.is-invalid]="form.controls.clave.invalid && form.controls.clave.touched" />
              <button type="button" class="btn btn-outline-secondary" (click)="verClave.set(!verClave())"
                      [attr.aria-label]="verClave() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                <i class="bi" [class.bi-eye]="!verClave()" [class.bi-eye-slash]="verClave()"></i>
              </button>
            </div>
            <app-error-campo [control]="form.controls.clave" [mensajes]="{ required: 'La contraseña es obligatoria' }" />
          </div>

          <div class="d-flex justify-content-end mb-3">
            <a routerLink="/recuperar" class="small">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>

        <p class="text-center mt-3 mb-0">
          ¿No tienes cuenta? <a routerLink="/registro" class="fw-semibold">Regístrate</a>
        </p>
      </div>
    </div>

    <div class="card tarjeta mt-3">
      <div class="card-body">
        <p class="small text-muted mb-2"><i class="bi bi-info-circle me-1"></i>Cuentas de prueba (clic para rellenar):</p>
        <div class="d-flex flex-wrap gap-2">
          @for (cuenta of cuentasPrueba; track cuenta.correo) {
            <button type="button" class="btn btn-outline-primary btn-sm" (click)="usarCuenta(cuenta.correo, cuenta.clave)">
              {{ cuenta.rol }}
            </button>
          }
        </div>
      </div>
    </div>
  </div>
</div>
