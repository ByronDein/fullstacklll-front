<nav class="navbar navbar-expand-lg navbar-dark app-navbar sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/inicio" (click)="cerrar()">
      <img src="logo.svg" width="34" height="34" alt="Logo de ForoNova" />
      <span class="fw-bold">ForoNova</span>
    </a>

    <button class="navbar-toggler" type="button" aria-label="Abrir o cerrar el menú"
            [attr.aria-expanded]="abierto()" (click)="alternar()">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="navbar-collapse collapse" [class.show]="abierto()">
      @if (auth.usuarioActual(); as usuario) {
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" routerLink="/inicio" routerLinkActive="active" (click)="cerrar()">
              <i class="bi bi-house-door me-1"></i>Inicio
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/nuevo-tema" routerLinkActive="active" (click)="cerrar()">
              <i class="bi bi-plus-circle me-1"></i>Nuevo tema
            </a>
          </li>
          @if (auth.esModerador()) {
            <li class="nav-item">
              <a class="nav-link" routerLink="/moderacion" routerLinkActive="active" (click)="cerrar()">
                <i class="bi bi-shield-check me-1"></i>Moderación
              </a>
            </li>
          }
          @if (auth.esAdmin()) {
            <li class="nav-item">
              <a class="nav-link" routerLink="/usuarios" routerLinkActive="active" (click)="cerrar()">
                <i class="bi bi-people me-1"></i>Usuarios
              </a>
            </li>
          }
        </ul>

        <div class="d-flex align-items-center gap-2 flex-wrap">
          <a routerLink="/perfil" class="d-flex align-items-center gap-2 text-white text-decoration-none" (click)="cerrar()">
            <span class="avatar" [style.background]="colorAvatar(usuario.id)">{{ iniciales(usuario.nombre) }}</span>
            <span class="d-flex flex-column lh-1">
              <span class="fw-semibold">{{ usuario.nombre }}</span>
              <span class="badge mt-1 align-self-start" [class]="'badge ' + claseRol(usuario.rol)">{{ usuario.rol }}</span>
            </span>
          </a>
          <button type="button" class="btn btn-outline-light btn-sm ms-lg-2" (click)="salir()">
            <i class="bi bi-box-arrow-right me-1"></i>Salir
          </button>
        </div>
      } @else {
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-lg-2">
          <li class="nav-item">
            <a class="nav-link" routerLink="/login" routerLinkActive="active" (click)="cerrar()">Iniciar sesión</a>
          </li>
          <li class="nav-item">
            <a class="btn btn-light btn-sm mt-1" routerLink="/registro" (click)="cerrar()">Crear cuenta</a>
          </li>
        </ul>
      }
    </div>
  </div>
</nav>
